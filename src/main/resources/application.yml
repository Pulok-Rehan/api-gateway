spring:
  cloud:
    gateway:
      default-filters:
        - AddRequestHeader=X-Gateway-Tag, SpringCloudGateway
        - RemoveRequestHeader=Cookie
      routes:
        - id: common-service
          uri: http://10.7.93.19:8086
#          uri: http://localhost:8086
          predicates:
            - Path=/api/public/common/**

        - id: onboarding-service
          uri: http://localhost:9092
#          uri: http://10.7.93.19:9092
          predicates:
            - Path=/onboarding/**


logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: DEBUG
